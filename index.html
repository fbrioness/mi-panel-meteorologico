<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Meteorológico</title>

    <!-- Solo se mantiene Chart.js para el gráfico Kp. Se eliminó jQuery, Moment y Moment Timezone. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .panel {
            width: 1920px;
            height: 1030px;
            display: grid;
            grid-template-columns: 550px 550px 820px;
            grid-template-rows: 1030px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
        }

        .logo-dga {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 118px;
            height: auto;
            z-index: 50;
        }

        #windy-iframe {
            width: 550px;
            height: 1030px;
            border: 0;
            display: block;
            background: #e8edf2;
        }

        .iframe-container {
            width: 550px;
            height: 1030px;
            display: grid;
            grid-template-rows: 515px 515px;
            background: #ffffff;
            overflow: hidden;
        }

        #instagram-1 {
            width: 550px;
            height: 515px;
            border: 0;
            display: block;
            background: #ffffff;
        }

        #kpindex-frame {
            width: 550px;
            height: 515px;
            box-sizing: border-box;
            overflow: hidden;
            background: #ffffff;
            border: 0;
            position: relative;
        }

        #kpindex-frame canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        #kpindex-error {
            display: none;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 20px;
            font-size: 16px;
            color: #b00020;
            background: #ffffff;
        }

        .right-iframes {
            width: 820px;
            height: 1030px;
            display: grid;
            grid-template-rows: 463px 567px;
            background: #ffffff;
            overflow: hidden;
        }

        #video-iframe {
            width: 820px;
            height: 463px;
            display: block;
            border: 0;
            background: #000000;
        }

        #meteoblue-iframe {
            width: 820px;
            height: 567px;
            display: block;
            border: 0;
            background: #ffffff;
        }
    </style>
</head>

<body>
    <div class="panel">
        <img src="https://dga.cerofilas.gob.cl/logos/dga.jpg" alt="Logo DGA" class="logo-dga">

        <!-- Windy: se actualiza cada 1 hora -->
        <iframe
            id="windy-iframe"
            width="550"
            height="1030"
            data-src="https://embed.windy.com/embed2.html?lat=-40.246&lon=-72.026&detailLat=-36.440&detailLon=-70.6500&width=550&height=1030&zoom=5&level=surface&overlay=satellite&product=satellite&menu=&message=true&marker=&calendar=now&pressure=true&type=map&location=coordinates&detail=&metricWind=km%2Fh&metricTemp=%C2%B0C&radarRange=-1"
            src="https://embed.windy.com/embed2.html?lat=-40.246&lon=-72.026&detailLat=-36.440&detailLon=-70.6500&width=550&height=1030&zoom=5&level=surface&overlay=satellite&product=satellite&menu=&message=true&marker=&calendar=now&pressure=true&type=map&location=coordinates&detail=&metricWind=km%2Fh&metricTemp=%C2%B0C&radarRange=-1"
            frameborder="0">
        </iframe>

        <div class="iframe-container">
            <!-- Instagram: se actualiza cada 1 hora -->
            <iframe
                id="instagram-1"
                data-src="https://www.instagram.com/mop_cl/embed"
                src="https://www.instagram.com/mop_cl/embed"
                width="550"
                height="515"
                frameborder="0"
                scrolling="no"
                allowtransparency="true">
            </iframe>

            <!-- Índice Kp: se actualiza cada 1 hora -->
            <div id="kpindex-frame">
                <canvas id="planetary_k_index_chart"></canvas>
                <div id="kpindex-error">No fue posible cargar el gráfico del índice Kp.</div>
            </div>
        </div>

        <div class="right-iframes">
            <!-- YouTube: NO se actualiza automáticamente -->
            <iframe
                id="video-iframe"
                src="https://www.youtube.com/embed/4wb_xjoZau8?si=u_t1DN-idwrpNImV"
                width="820"
                height="463"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
                scrolling="no">
            </iframe>

            <!-- Meteoblue: queda fijo, sin actualización automática -->
            <iframe
                id="meteoblue-iframe"
                src="https://www.meteoblue.com/es/tiempo/widget/daily/santiago-de-chile_chile_3871336?geoloc=fixed&days=7&tempunit=CELSIUS&windunit=KILOMETER_PER_HOUR&precipunit=MILLIMETER&coloured=coloured&pictoicon=0&pictoicon=1&maxtemperature=0&maxtemperature=1&mintemperature=0&mintemperature=1&windspeed=0&windspeed=1&windgust=0&winddirection=0&winddirection=1&uv=0&humidity=0&precipitation=0&precipitation=1&precipitationprobability=0&precipitationprobability=1&spot=0&spot=1&pressure=0&layout=light"
                width="820"
                height="567"
                frameborder="0"
                scrolling="no"
                allowtransparency="true"
                sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox">
            </iframe>
        </div>
    </div>

    <script>
        const UNA_HORA = 60 * 60 * 1000;
        let kpChart = null;

        function getKpColor(value) {
            if (value >= 7) return '#C80000';
            if (value >= 5) return '#FF0000';
            if (value >= 4) return '#FF9600';
            if (value >= 3) return '#FFC800';
            return '#92D050';
        }

        function formatChileTimeRange(utcTimeTag) {
            const startDate = new Date(utcTimeTag);
            const endDate = new Date(startDate.getTime() + 3 * 60 * 60 * 1000);

            const dateFormatter = new Intl.DateTimeFormat('es-CL', {
                timeZone: 'America/Santiago',
                day: '2-digit',
                month: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });

            const hourFormatter = new Intl.DateTimeFormat('es-CL', {
                timeZone: 'America/Santiago',
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });

            return `${dateFormatter.format(startDate)} a ${hourFormatter.format(endDate)}`;
        }

        async function loadKpChart() {
            const errorBox = document.getElementById('kpindex-error');
            const canvas = document.getElementById('planetary_k_index_chart');

            try {
                const response = await fetch(
                    'https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json?v=' + Date.now(),
                    { cache: 'no-store' }
                );

                if (!response.ok) {
                    throw new Error('No se pudo obtener la información NOAA.');
                }

                const json = await response.json();

                if (!Array.isArray(json) || json.length === 0) {
                    throw new Error('La respuesta NOAA está vacía o no es válida.');
                }

                const data = json.filter(item =>
                    item &&
                    item.time_tag &&
                    item.Kp !== undefined &&
                    !Number.isNaN(parseFloat(item.Kp))
                );

                if (data.length === 0) {
                    throw new Error('No hay datos válidos para graficar.');
                }

                const filteredData = data.slice(-16);
                const labels = filteredData.map(item => formatChileTimeRange(item.time_tag));
                const values = filteredData.map(item => parseFloat(item.Kp));

                if (errorBox) errorBox.style.display = 'none';

                if (kpChart) {
                    kpChart.destroy();
                }

                kpChart = new Chart(canvas.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Índice Kp',
                            data: values,
                            backgroundColor: values.map(getKpColor),
                            borderColor: '#666666',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        animation: false,
                        layout: {
                            padding: {
                                top: 10,
                                right: 10,
                                bottom: 10,
                                left: 10
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 9,
                                ticks: { stepSize: 1 },
                                title: { display: true, text: 'Índice Kp' }
                            },
                            x: {
                                ticks: {
                                    autoSkip: true,
                                    maxRotation: 90,
                                    minRotation: 45,
                                    font: { size: 10 }
                                },
                                title: { display: true, text: 'Hora Local de Chile' }
                            }
                        },
                        plugins: {
                            legend: { display: true },
                            title: {
                                display: true,
                                text: 'Índice K Planetario Estimado (Últimas 48 horas)'
                            }
                        }
                    }
                });
            } catch (error) {
                console.error(error);
                if (errorBox) errorBox.style.display = 'block';
            }
        }

        function refreshIframe(id) {
            const iframe = document.getElementById(id);
            if (!iframe) return;

            const baseSrc = iframe.dataset.src || iframe.src;
            const separator = baseSrc.includes('?') ? '&' : '?';

            iframe.src = `${baseSrc}${separator}refresh=${Date.now()}`;
        }

        function actualizarPanelesCadaHora() {
            loadKpChart();

            setTimeout(() => {
                refreshIframe('windy-iframe');
            }, 5000);

            setTimeout(() => {
                refreshIframe('instagram-1');
            }, 15000);

            // YouTube no se recarga.
            // Meteoblue queda fijo en esta versión.
        }

        loadKpChart();

        setInterval(actualizarPanelesCadaHora, UNA_HORA);
    </script>
</body>
</html>
