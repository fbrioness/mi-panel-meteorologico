<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Meteorológico</title>
    <link rel="stylesheet" href="styles.css?v=20260608-iframe-01">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.34/moment-timezone-with-data.min.js"></script>

    <style>
* { box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

.panel {
    width: 1920px;
    height: 1030px;
    display: grid;
    grid-template-columns: 550px 550px 820px;
    grid-template-rows: 1030px;
    background: #ffffff;
    position: relative;
    overflow: hidden;
}

.logo-dga {
    position: absolute;
    top: 10px;
    left: 10px;
    width: 118px;
    height: auto;
    z-index: 50;
}

.fixtures-frame {
    width: 550px;
    height: 1030px;
    border: 0;
    display: block;
    background: #e8edf2;
}

.iframe-container {
    width: 550px;
    height: 1030px;
    display: grid;
    grid-template-rows: 515px 515px;
    background: #ffffff;
    overflow: hidden;
}

#instagram-1 {
    width: 550px;
    height: 515px;
    border: 0;
    display: block;
    background: #ffffff;
}

#kpindex-frame {
    width: 550px;
    height: 515px;
    box-sizing: border-box;
    overflow: hidden;
    background: #ffffff;
    border: 0;
    position: relative;
}

#kpindex-frame canvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
}

#kpindex-error {
    display: none;
    width: 100%;
    height: 100%;
    box-sizing: border-box;
    padding: 20px;
    font-family: Arial, sans-serif;
    font-size: 16px;
    color: #b00020;
    background: #ffffff;
}

.right-iframes {
    width: 820px;
    height: 1030px;
    display: grid;
    grid-template-rows: 463px 567px;
    background: #ffffff;
    overflow: hidden;
}

#video-iframe {
    width: 820px;
    height: 463px;
    display: block;
    border: 0;
    background: #000000;
}

#meteoblue-iframe {
    width: 820px;
    height: 567px;
    display: block;
    border: 0;
    background: #ffffff;
}
</style>
</head>
<body>
    <div class="panel">
     <!--    <img src="https://dga.cerofilas.gob.cl/logos/dga.jpg" alt="Logo DGA" class="logo-dga"> -->

        <!-- Iframe local liviano para tabla de partidos -->
<iframe
    id="fixtures-iframe"
    class="fixtures-frame"
    src="https://meteorpa.github.io/fixtures/"
    width="550"
    height="1030"
    frameborder="0"
    scrolling="no">
</iframe>

        <div class="iframe-container">
            <iframe
                id="instagram-1"
                src="https://www.instagram.com/mop_cl/embed"
                width="550"
                height="515"
                frameborder="0"
                scrolling="no"
                allowtransparency="true">
            </iframe>

            <div id="kpindex-frame">
                <canvas id="planetary_k_index_chart"></canvas>
                <div id="kpindex-error">No fue posible cargar el gráfico del índice Kp.</div>
            </div>
        </div>

        <div class="right-iframes">
            <iframe
                id="video-iframe"
                src="https://www.youtube.com/embed/IEVv3T4ujj0?si=PuXN1WI6JPhlSHGy"
                width="820"
                height="463"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
                scrolling="no">
            </iframe>

            <iframe
                id="meteoblue-iframe"
                class="bottom-right-iframe"
                src="https://www.meteoblue.com/es/tiempo/widget/daily/santiago-de-chile_chile_3871336?geoloc=fixed&days=7&tempunit=CELSIUS&windunit=KILOMETER_PER_HOUR&precipunit=MILLIMETER&coloured=coloured&pictoicon=0&pictoicon=1&maxtemperature=0&maxtemperature=1&mintemperature=0&mintemperature=1&windspeed=0&windspeed=1&windgust=0&winddirection=0&winddirection=1&uv=0&humidity=0&precipitation=0&precipitation=1&precipitationprobability=0&precipitationprobability=1&spot=0&spot=1&pressure=0&layout=light"
                frameborder="0"
                scrolling="NO"
                allowtransparency="true"
                sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox"
                style="width: 820px; height: 567px">
            </iframe>
        </div>
    </div>

    <script>
        let kpChart = null;

        function getKpColor(value) {
            if (value >= 7) return '#C80000';
            if (value >= 5) return '#FF0000';
            if (value >= 4) return '#FF9600';
            if (value >= 3) return '#FFC800';
            return '#92D050';
        }

        function loadKpChart() {
            $.getJSON('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json')
                .done(function(response) {
                    if (!Array.isArray(response) || response.length === 0) {
                        throw new Error('La respuesta NOAA está vacía o no es válida.');
                    }

                    const data = response.filter(item =>
                        item &&
                        item.time_tag &&
                        item.Kp !== undefined &&
                        !isNaN(parseFloat(item.Kp))
                    );

                    if (data.length === 0) {
                        throw new Error('No hay datos válidos para graficar.');
                    }

                    const filteredData = data.slice(-16);

                    const labels = filteredData.map(item => {
                        const start = moment.utc(item.time_tag).tz("America/Santiago");
                        const end = start.clone().add(3, 'hours');
                        return `${start.format('DD/MM HH:mm')} a ${end.format('HH:mm')}`;
                    });

                    const values = filteredData.map(item => parseFloat(item.Kp));

                    const ctx = document.getElementById('planetary_k_index_chart').getContext('2d');
                    document.getElementById('kpindex-error').style.display = 'none';

                    if (kpChart) {
                        kpChart.destroy();
                    }

                    kpChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Índice Kp',
                                data: values,
                                backgroundColor: values.map(getKpColor),
                                borderColor: '#666666',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: false,
                            layout: {
                                padding: {
                                    top: 10,
                                    right: 10,
                                    bottom: 10,
                                    left: 10
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 9,
                                    ticks: { stepSize: 1 },
                                    title: { display: true, text: 'Índice Kp' }
                                },
                                x: {
                                    ticks: {
                                        autoSkip: true,
                                        maxRotation: 90,
                                        minRotation: 45,
                                        font: { size: 10 }
                                    },
                                    title: { display: true, text: 'Hora Local de Chile' }
                                }
                            },
                            plugins: {
                                legend: { display: true },
                                title: {
                                    display: true,
                                    text: 'Índice K Planetario Estimado (Últimas 48 horas)'
                                }
                            }
                        }
                    });
                })
                .fail(function() {
                    document.getElementById('kpindex-error').style.display = 'block';
                });
        }

        function recargarIframe(id) {
            const iframe = document.getElementById(id);
            if (!iframe || !iframe.src) return;
            iframe.src = iframe.src;
        }

        function actualizarPanelCadaTresHoras() {
            loadKpChart();

            setTimeout(function() {
                recargarIframe('instagram-1');
            }, 10000);

            setTimeout(function() {
                recargarIframe('meteoblue-iframe');
            }, 30000);

            // No recargar YouTube.
            // No recargar fixtures.html.
        }

        loadKpChart();

        const tiempoActualizacionGeneral = 10800000;
        setInterval(actualizarPanelCadaTresHoras, tiempoActualizacionGeneral);
    </script>
</body>
</html>
