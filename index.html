<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteorología</title>
    <link rel="stylesheet" href="styles.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.34/moment-timezone-with-data.min.js"></script>

    <style>
        /* ==============================
           TABLA MUNDIAL DESDE API MARCA
        ============================== */

        #mundial-api-widget {
            width: 550px;
            height: 515px;
            box-sizing: border-box;
            overflow: hidden;
            background: #ffffff;
            border: 0;
            position: relative;
            font-family: Arial, sans-serif;
        }

        #mundial-api-title {
            height: 42px;
            line-height: 42px;
            box-sizing: border-box;
            padding: 0 12px;
            background: #111111;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        #mundial-api-content {
            width: 550px;
            height: 473px;
            box-sizing: border-box;
            padding: 12px;
            overflow: hidden;
            background: #ffffff;
        }

        .mundial-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            color: #555555;
        }

        .mundial-meta span {
            display: block;
        }

        .mundial-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            table-layout: fixed;
        }

        .mundial-table thead {
            background: #eeeeee;
        }

        .mundial-table th,
        .mundial-table td {
            padding: 7px 4px;
            border-bottom: 1px solid #dddddd;
            text-align: center;
            vertical-align: middle;
        }

        .mundial-table th {
            font-size: 11px;
            color: #333333;
            font-weight: bold;
        }

        .mundial-table td {
            color: #111111;
        }

        .mundial-table .col-pos {
            width: 28px;
            font-weight: bold;
        }

        .mundial-table .col-team {
            width: 210px;
            text-align: left;
        }

        .mundial-team {
            display: flex;
            align-items: center;
            gap: 7px;
            min-width: 0;
        }

        .mundial-team img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .mundial-team-name {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-weight: bold;
        }

        .mundial-points {
            font-weight: bold;
            background: #f5f5f5;
            border-radius: 4px;
        }

        #mundial-api-error {
            display: none;
            height: 100%;
            box-sizing: border-box;
            padding: 20px;
            font-size: 15px;
            line-height: 22px;
            color: #b00020;
            background: #fff5f5;
            border: 1px solid #f0cccc;
        }

        #mundial-api-loading {
            display: none;
            padding: 20px;
            font-size: 15px;
            text-align: center;
            color: #555555;
        }

        /* ==============================
           GRÁFICO KP
        ============================== */

        #kpindex-frame {
            width: 550px;
            height: 515px;
            box-sizing: border-box;
            overflow: hidden;
            background: #ffffff;
            border: 0;
            position: relative;
        }

        #kpindex-frame canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        #kpindex-error {
            display: none;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 20px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            color: #b00020;
            background: #fff;
        }
    </style>
</head>

<body>
    <div class="panel">
        <img src="https://dga.cerofilas.gob.cl/logos/dga.jpg" alt="Logo DGA" class="logo-dga">

        <!-- Iframe de Windy a la izquierda -->
        <iframe
            id="windy-iframe"
            width="550"
            height="1030"
            src="https://embed.windy.com/embed2.html?lat=-40.246&lon=-72.026&detailLat=-36.440&detailLon=-70.6500&width=550&height=1030&zoom=5&level=surface&overlay=satellite&product=satellite&menu=&message=true&marker=&calendar=now&pressure=true&type=map&location=coordinates&detail=&metricWind=km%2Fh&metricTemp=%C2%B0C&radarRange=-1"
            frameborder="0">
        </iframe>

        <div class="iframe-container">

            <!-- Reemplazo de Instagram / MARCA iframe por tabla desde API -->
            <div id="mundial-api-widget">
                <div id="mundial-api-title">Fase de grupos - Mundial 2026</div>

                <div id="mundial-api-content">
                    <div id="mundial-api-loading">Cargando tabla de posiciones...</div>

                    <div id="mundial-api-error">
                        No fue posible cargar la tabla de posiciones del Mundial.
                    </div>

                    <div id="mundial-api-table-container">
                        <div class="mundial-meta">
                            <span id="mundial-group-name">Grupo</span>
                            <span id="mundial-last-update">Actualizando...</span>
                        </div>

                        <table class="mundial-table">
                            <thead>
                                <tr>
                                    <th class="col-pos">#</th>
                                    <th class="col-team">Equipo</th>
                                    <th>PTS</th>
                                    <th>PJ</th>
                                    <th>G</th>
                                    <th>E</th>
                                    <th>P</th>
                                    <th>GF</th>
                                    <th>GC</th>
                                    <th>DG</th>
                                </tr>
                            </thead>
                            <tbody id="mundial-table-body">
                                <!-- Datos cargados por JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Gráfico KP -->
            <div id="kpindex-frame">
                <canvas id="planetary_k_index_chart"></canvas>
                <div id="kpindex-error">No fue posible cargar el gráfico del índice Kp.</div>
            </div>
        </div>

        <!-- Contenedor para los iframes de la derecha -->
        <div class="right-iframes">

            <!-- Iframe superior derecho: YouTube -->
            <iframe
                id="video-iframe"
                src="https://www.youtube.com/embed/IEVv3T4ujj0?si=ltxYdesg0oi9mbHy"
                width="820"
                height="463"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
                scrolling="no">
            </iframe>

            <!-- Iframe inferior derecho: Meteoblue -->
            <iframe
                id="meteoblue-iframe"
                class="bottom-right-iframe"
                src="https://www.meteoblue.com/es/tiempo/widget/daily/santiago-de-chile_chile_3871336?geoloc=fixed&days=7&tempunit=CELSIUS&windunit=KILOMETER_PER_HOUR&precipunit=MILLIMETER&coloured=coloured&pictoicon=0&pictoicon=1&maxtemperature=0&maxtemperature=1&mintemperature=0&mintemperature=1&windspeed=0&windspeed=1&windgust=0&winddirection=0&winddirection=1&uv=0&humidity=0&precipitation=0&precipitation=1&precipitationprobability=0&precipitationprobability=1&spot=0&spot=1&pressure=0&layout=light"
                frameborder="0"
                scrolling="NO"
                allowtransparency="true"
                sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox"
                style="width: 820px; height: 560px">
            </iframe>
        </div>
    </div>

    <script>
        /* ==============================
           TABLA MUNDIAL DESDE API MARCA
        ============================== */

        const mundialGrupos = [
            { id: 1, nombre: "Grupo A" },
            { id: 2, nombre: "Grupo B" },
            { id: 3, nombre: "Grupo C" },
            { id: 4, nombre: "Grupo D" },
            { id: 5, nombre: "Grupo E" },
            { id: 6, nombre: "Grupo F" },
            { id: 7, nombre: "Grupo G" },
            { id: 8, nombre: "Grupo H" },
            { id: 9, nombre: "Grupo I" },
            { id: 10, nombre: "Grupo J" },
            { id: 11, nombre: "Grupo K" },
            { id: 12, nombre: "Grupo L" }
        ];

        let mundialGrupoActual = 0;

        // Tiempo de rotación entre grupos.
        // 60000 = 1 minuto.
        const tiempoRotacionMundial = 60000;

        function getMundialApiUrl(groupId) {
            return `https://api.unidadeditorial.es/sports/v1/classifications/current/?site=2&type=10&tournament=0117&group=${groupId}&season=2025`;
        }

        function mostrarEstadoMundial(estado) {
            const loading = document.getElementById('mundial-api-loading');
            const error = document.getElementById('mundial-api-error');
            const tableContainer = document.getElementById('mundial-api-table-container');

            if (estado === 'loading') {
                loading.style.display = 'block';
                error.style.display = 'none';
                tableContainer.style.display = 'none';
            }

            if (estado === 'error') {
                loading.style.display = 'none';
                error.style.display = 'block';
                tableContainer.style.display = 'none';
            }

            if (estado === 'ok') {
                loading.style.display = 'none';
                error.style.display = 'none';
                tableContainer.style.display = 'block';
            }
        }

        function formatearFechaChile(fechaIso) {
            if (!fechaIso) return '';

            try {
                return moment.utc(fechaIso)
                    .tz("America/Santiago")
                    .format("DD/MM/YYYY HH:mm");
            } catch (error) {
                return '';
            }
        }

        async function cargarTablaMundial() {
            const grupo = mundialGrupos[mundialGrupoActual];
            const url = getMundialApiUrl(grupo.id);

            const title = document.getElementById('mundial-api-title');
            const groupName = document.getElementById('mundial-group-name');
            const lastUpdate = document.getElementById('mundial-last-update');
            const tbody = document.getElementById('mundial-table-body');

            title.textContent = `Fase de grupos - ${grupo.nombre}`;
            groupName.textContent = grupo.nombre;

            mostrarEstadoMundial('loading');

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error(`Error HTTP ${response.status}`);
                }

                const json = await response.json();

                if (
                    !json ||
                    json.status !== 'success' ||
                    !Array.isArray(json.data) ||
                    json.data.length === 0 ||
                    !Array.isArray(json.data[0].rank)
                ) {
                    throw new Error('Respuesta API no válida.');
                }

                const classification = json.data[0];
                const head = classification.classificationHead || {};
                const apiGroupName =
                    head.group?.alternateNames?.esES ||
                    head.group?.name ||
                    grupo.nombre;

                const phaseName =
                    head.phase?.alternateNames?.esES ||
                    head.phase?.name ||
                    'Fase de grupos';

                title.textContent = `${phaseName} - ${apiGroupName}`;
                groupName.textContent = apiGroupName;

                const updateText = formatearFechaChile(classification.lastUpdate);
                lastUpdate.textContent = updateText ? `Act. ${updateText}` : '';

                tbody.innerHTML = '';

                classification.rank.forEach(team => {
                    const standing = team.standing || {};

                    const flag =
                        team.images?.urlFlag?.[2] ||
                        team.images?.urlFlag?.[1] ||
                        team.images?.urlFlag?.[0] ||
                        team.imageUrl ||
                        '';

                    const tr = document.createElement('tr');

                    tr.innerHTML = `
                        <td class="col-pos">${standing.position || '-'}</td>
                        <td class="col-team">
                            <div class="mundial-team">
                                ${flag ? `<img src="${flag}" alt="${team.name || ''}">` : ''}
                                <span class="mundial-team-name">${team.name || team.fullName || '-'}</span>
                            </div>
                        </td>
                        <td class="mundial-points">${standing.points || '0'}</td>
                        <td>${standing.played || '0'}</td>
                        <td>${standing.won || '0'}</td>
                        <td>${standing.drawn || '0'}</td>
                        <td>${standing.lost || '0'}</td>
                        <td>${standing.for || '0'}</td>
                        <td>${standing.against || '0'}</td>
                        <td>${standing.difference || '0'}</td>
                    `;

                    tbody.appendChild(tr);
                });

                mostrarEstadoMundial('ok');

            } catch (error) {
                console.error('Error cargando tabla Mundial:', error);
                mostrarEstadoMundial('error');
            }
        }

        function rotarTablaMundial() {
            mundialGrupoActual++;

            if (mundialGrupoActual >= mundialGrupos.length) {
                mundialGrupoActual = 0;
            }

            cargarTablaMundial();
        }

        /* ==============================
           GRÁFICO KP
        ============================== */

        let kpChart = null;

        function getKpColor(value) {
            if (value >= 7) return '#C80000';
            if (value >= 5) return '#FF0000';
            if (value >= 4) return '#FF9600';
            if (value >= 3) return '#FFC800';
            return '#92D050';
        }

        function loadKpChart() {
            $.getJSON('https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json')
                .done(function(response) {
                    console.log('Respuesta NOAA:', response);

                    if (!Array.isArray(response) || response.length === 0) {
                        throw new Error('La respuesta NOAA está vacía o no es válida.');
                    }

                    const data = response.filter(item =>
                        item &&
                        item.time_tag &&
                        item.Kp !== undefined &&
                        !isNaN(parseFloat(item.Kp))
                    );

                    if (data.length === 0) {
                        throw new Error('No hay datos válidos para graficar.');
                    }

                    // Últimos 16 registros = 48 horas aprox. en intervalos de 3 horas
                    const filteredData = data.slice(-16);

                    const labels = filteredData.map(item => {
                        const start = moment.utc(item.time_tag).tz("America/Santiago");
                        const end = start.clone().add(3, 'hours');
                        return `${start.format('DD/MM HH:mm')} a ${end.format('HH:mm')}`;
                    });

                    const values = filteredData.map(item => parseFloat(item.Kp));

                    console.log('Datos filtrados:', filteredData);
                    console.log('Labels:', labels);
                    console.log('Values:', values);

                    const ctx = document.getElementById('planetary_k_index_chart').getContext('2d');
                    document.getElementById('kpindex-error').style.display = 'none';

                    if (kpChart) {
                        kpChart.destroy();
                    }

                    kpChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Índice Kp',
                                data: values,
                                backgroundColor: values.map(getKpColor),
                                borderColor: '#666666',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            animation: false,
                            layout: {
                                padding: {
                                    top: 10,
                                    right: 10,
                                    bottom: 10,
                                    left: 10
                                }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    max: 9,
                                    ticks: {
                                        stepSize: 1
                                    },
                                    title: {
                                        display: true,
                                        text: 'Índice Kp'
                                    }
                                },
                                x: {
                                    ticks: {
                                        autoSkip: true,
                                        maxRotation: 90,
                                        minRotation: 45,
                                        font: {
                                            size: 10
                                        }
                                    },
                                    title: {
                                        display: true,
                                        text: 'Hora Local de Chile'
                                    }
                                }
                            },
                            plugins: {
                                legend: {
                                    display: true
                                },
                                title: {
                                    display: true,
                                    text: 'Índice K Planetario Estimado (Últimas 48 horas)'
                                }
                            }
                        }
                    });
                })
                .fail(function(jqxhr, textStatus, error) {
                    console.error('Error cargando JSON NOAA:', textStatus, error);
                    document.getElementById('kpindex-error').style.display = 'block';
                });
        }

        /* ==============================
           INICIO
        ============================== */

        // Cargar tabla del Mundial al iniciar
        cargarTablaMundial();

        // Rotar grupos cada 1 minuto sin tocar YouTube
        setInterval(rotarTablaMundial, tiempoRotacionMundial);

        // Cargar gráfico KP al iniciar
        loadKpChart();

        // Actualizar solo el gráfico KP cada 1 hora.
        // No se recarga YouTube, Windy ni Meteoblue.
        const refreshTime = 3600000;

        setInterval(function() {
            loadKpChart();
        }, refreshTime);
    </script>
</body>
</html>
